# ══════════════════════════════════════════════════════════════
#  BASE DE DATOS
#  Para LOCAL:   comenta las líneas de RAILWAY y descomenta LOCAL
#  Para RAILWAY: deja las líneas de RAILWAY y comenta LOCAL
# ══════════════════════════════════════════════════════════════

quarkus.datasource.db-kind = mysql

# -- LOCAL --
#quarkus.datasource.username = root
#quarkus.datasource.password = Fn30Df19
#quarkus.datasource.jdbc.url = jdbc:mysql://localhost:3306/ToDo

# -- RAILWAY (usa las variables que Railway inyecta automáticamente) --
quarkus.datasource.username = ${MYSQLUSER}
quarkus.datasource.password = ${MYSQLPASSWORD}
quarkus.datasource.jdbc.url = jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}

# ══════════════════════════════════════════════════════════════
#  HIBERNATE
# ══════════════════════════════════════════════════════════════

quarkus.hibernate-orm.schema-management.strategy = update

# ══════════════════════════════════════════════════════════════
#  FIREBASE CREDENTIALS
#  Para LOCAL:   comenta RAILWAY y descomenta LOCAL
#  Para RAILWAY: deja RAILWAY y comenta LOCAL
# ══════════════════════════════════════════════════════════════

# -- LOCAL --
#firebase.credentials=src/main/resources/todo-2524b-firebase-adminsdk-fbsvc-65f2b4d170.json

# -- RAILWAY (lee el JSON desde variable de entorno en base64) --
firebase.credentials=env

# ══════════════════════════════════════════════════════════════
#  SERVIDOR HTTP
#  Para LOCAL:   comenta RAILWAY y descomenta LOCAL
#  Para RAILWAY: deja RAILWAY y comenta LOCAL
# ══════════════════════════════════════════════════════════════

quarkus.http.host=0.0.0.0

# -- LOCAL --
#quarkus.http.port=8080

# -- RAILWAY (Railway inyecta el puerto en la variable PORT) --
quarkus.http.port=${PORT:8080}

# ══════════════════════════════════════════════════════════════
#  CORS
# ══════════════════════════════════════════════════════════════

quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With
quarkus.http.cors.exposed-headers=Content-Disposition
